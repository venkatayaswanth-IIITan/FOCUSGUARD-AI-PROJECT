name: focusguard-ai-platform

services:
  # ============================================================
  # 1. PostgreSQL Relational Database Service (Private Network)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: focusguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-focusguard_db}
    ports:
      # Bound strictly to localhost loopback to prevent exposure to public internet
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-focusguard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - focusguard-network

  # ============================================================
  # 2. Node.js Backend API, WebSockets & RAG Engine
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusguard-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
      DB_NAME: ${POSTGRES_DB:-focusguard_db}
      JWT_SECRET: ${JWT_SECRET:-focusguard_secret_key_prod_2026}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_FALLBACK: ${GROQ_API_KEY_FALLBACK:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      # Bound to localhost loopback — all public traffic routed securely through Nginx
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - focusguard-network

  # ============================================================
  # 3. React SPA Dashboard & Nginx Reverse Proxy (Public Entry)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    container_name: focusguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      # Optional mounts for Let's Encrypt SSL certificates on VPS
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://localhost:80/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - focusguard-network

  # ============================================================
  # 4. Optional AI Training Worker Profile
  # ============================================================
  ai-train:
    build:
      context: .
      dockerfile: ./ai/Dockerfile
    container_name: focusguard-ai-train
    profiles:
      - tools
    volumes:
      - ./ai/models:/app/ai/models
      - ./ai/reports:/app/ai/reports
    networks:
      - focusguard-network

volumes:
  postgres_data:
    name: focusguard_postgres_data
    driver: local

networks:
  focusguard-network:
    name: focusguard_network
    driver: bridge
